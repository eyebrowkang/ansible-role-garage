---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Checked out under the galaxy role name so molecule's
    # ANSIBLE_ROLES_PATH=.. resolves eyebrowkang.garage correctly.
    working-directory: eyebrowkang.garage

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eyebrowkang.garage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: eyebrowkang.garage/requirements-ci.txt

      - name: Install tooling
        run: pip install -r requirements-ci.txt

      - name: yamllint
        run: yamllint -c .yamllint.yml --strict .

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: molecule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - ubuntu2404
          - rockylinux9
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      ANSIBLE_FORCE_COLOR: "1"
      PY_COLORS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: eyebrowkang.garage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: eyebrowkang.garage/requirements-ci.txt

      - name: Install tooling
        run: pip install -r requirements-ci.txt

      - name: Run molecule (ci scenario)
        run: molecule test -s ci

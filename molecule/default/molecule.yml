---
# Docker scenario — fast; runs on GitHub public runners (distro matrix via MOLECULE_DISTRO).
# Uses molecule's built-in "default" (delegated) driver + our own create/destroy
# playbooks driving community.docker. This avoids molecule-plugins[docker], whose
# create playbook is incompatible with ansible-core 2.21 (data-tagging changes).
dependency:
  name: galaxy   # auto-installs molecule/default/collections.yml (scenario-absolute path)

driver:
  name: default
  options:
    managed: true

platforms:
  # Distro selected by MOLECULE_DISTRO (CI matrix: debian12, ubuntu2404, rockylinux9).
  # systemd-enabled images so the garage service unit can be tested in-container.
  - name: garage-${MOLECULE_DISTRO:-debian12}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    systemd: true
    groups:
      - garage_servers
      # inventory/group_vars/docker_instances.yml turns become off for this scenario only.
      - docker_instances

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    # The test variables (inventory/group_vars/), shared with the other scenarios.
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check Garage service is active
      ansible.builtin.systemd_service:
        name: garage
      register: garage_service

    - name: Assert service is active
      ansible.builtin.assert:
        that:
          - garage_service.status.ActiveState == "active"
        fail_msg: "Garage service is not active (state: {{ garage_service.status.ActiveState }})"

    - name: Check admin API port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3903
        timeout: 30
        state: started

    - name: Run garage status command
      ansible.builtin.command:
        cmd: /usr/local/bin/garage --config /etc/garage/garage.toml status
      register: garage_status
      changed_when: false

    - name: Display garage status
      ansible.builtin.debug:
        msg: "{{ garage_status.stdout }}"

    - name: Assert all cluster nodes are connected and healthy
      ansible.builtin.assert:
        that:
          - garage_status.stdout_lines | select('match', '^[0-9a-f]{16}\\s') | list | length == 3
          - "'FAILED' not in garage_status.stdout"
        fail_msg: >-
          Expected 3 healthy nodes in 'garage status' output, got:
          {{ garage_status.stdout }}

    - name: Read cluster layout
      ansible.builtin.command:
        cmd: /usr/local/bin/garage --config /etc/garage/garage.toml layout show
      register: garage_layout
      changed_when: false

    - name: Assert layout version 1 with all three nodes assigned
      ansible.builtin.assert:
        that:
          - "'Current cluster layout version: 1' in garage_layout.stdout"
          - garage_layout.stdout_lines | select('match', '^[0-9a-f]{16}\\s') | list | length == 3
        fail_msg: >-
          Expected layout version 1 with 3 assigned nodes, got:
          {{ garage_layout.stdout }}

    - name: Check health endpoint reports healthy cluster
      ansible.builtin.uri:
        url: "http://127.0.0.1:3903/health"
        method: GET
        status_code: 200

    - name: Verify replication_factor in config
      ansible.builtin.command:
        cmd: grep -c "replication_factor = 3" /etc/garage/garage.toml
      register: replication_check
      changed_when: false

    - name: Assert replication_factor is 3
      ansible.builtin.assert:
        that:
          - replication_check.stdout | int > 0
        fail_msg: "replication_factor is not set to 3 in config"

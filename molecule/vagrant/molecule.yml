---
# Vagrant + libvirt scenario — VM-only needs (kernel modules, reboot, real networking).
# Runs locally (needs `uv sync --group vagrant` + libvirt/KVM); GitHub has no KVM,
# so the vagrant scenarios are local-only.
#
# molecule-plugins#301: run this via `make test-vm`, which exports ANSIBLE_LIBRARY /
# ANSIBLE_FILTER_PLUGINS so Ansible can find the vagrant module/filter. A bare
# `molecule test -s vagrant` fails without those.
dependency:
  name: galaxy   # auto-installs molecule/vagrant/collections.yml (scenario-absolute path)

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: garage-vm
    box: generic/debian12
    memory: 1024
    cpus: 1
    groups:
      - garage_servers

provisioner:
  name: ansible
  # The docker scenario's playbooks and test variables (the same linked inventory). The
  # vagrant driver supplies ansible_user itself.
  playbooks:
    converge: ../default/converge.yml
    verify: ../default/verify.yml
  inventory:
    links:
      group_vars: ../default/inventory/group_vars/

verifier:
  name: ansible

scenario:
  name: vagrant
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

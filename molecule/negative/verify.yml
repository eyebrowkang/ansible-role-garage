---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check Garage service is active
      ansible.builtin.systemd_service:
        name: garage
      register: garage_service

    - name: Assert service survived all negative tests
      ansible.builtin.assert:
        that:
          - garage_service.status.ActiveState == "active"
        fail_msg: "Garage service is not active (state: {{ garage_service.status.ActiveState }})"

    # The real install in converge used the role's default garage_version.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Check installed version is unchanged (the role default)
      ansible.builtin.command:
        cmd: /usr/local/bin/garage --version
      register: garage_version_out
      changed_when: false

    - name: Assert no downgrade/upgrade happened
      ansible.builtin.assert:
        that:
          - garage_version_out.stdout is search('^garage ' ~ garage_version ~ ' ')
        fail_msg: "Version changed unexpectedly: {{ garage_version_out.stdout }}"

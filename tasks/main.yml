---
- name: Validate
  ansible.builtin.include_tasks: validate.yml

- name: Setup
  ansible.builtin.include_tasks: setup.yml

- name: Version check
  ansible.builtin.include_tasks: version_check.yml
  when: garage_upgrade | bool

- name: Upgrade
  ansible.builtin.include_tasks: upgrade.yml
  when: garage_upgrade | bool and (_garage_upgrade_needed | default(false) | bool)

- name: Install
  ansible.builtin.include_tasks: install.yml
  when: not (garage_upgrade | bool) or (_garage_install_needed | default(false) | bool)

- name: Configure
  ansible.builtin.include_tasks: configure.yml

- name: Service
  ansible.builtin.include_tasks: service.yml

- name: Cluster connect
  ansible.builtin.include_tasks: cluster.yml
  when: garage_cluster_connect | bool

- name: Layout init
  ansible.builtin.include_tasks: layout.yml
  when: garage_layout_init | bool

- name: Health check
  ansible.builtin.include_tasks: healthcheck.yml
  when: garage_healthcheck_enabled | bool

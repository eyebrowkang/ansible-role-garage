---
# Shared download logic for install and upgrade.
# Callers set _garage_download_force: true to replace an existing binary.

- name: Determine system architecture
  ansible.builtin.set_fact:
    _garage_arch: "{{ _garage_arch_map[ansible_architecture] | default('') }}"

- name: Fail on unsupported architecture
  ansible.builtin.fail:
    msg: >-
      Unsupported architecture '{{ ansible_architecture }}': no official Garage
      build is available. Supported: {{ _garage_arch_map.keys() | join(', ') }}.
      Set garage_download_url (and garage_checksum) to use a custom build.
  when:
    - _garage_arch | length == 0
    - garage_download_url | length == 0

- name: Compute effective download URL
  ansible.builtin.set_fact:
    _garage_download_url: >-
      {{ garage_download_url if garage_download_url != ""
         else "https://garagehq.deuxfleurs.fr/_releases/" ~ garage_version ~ "/" ~ _garage_arch ~ "/garage" }}

- name: Compute effective checksum
  ansible.builtin.set_fact:
    _garage_effective_checksum: >-
      {%- set _raw = (garage_checksum if garage_checksum != ""
         else _garage_known_checksums[garage_version][_garage_arch]
              if garage_version in _garage_known_checksums
                 and _garage_arch in _garage_known_checksums[garage_version]
         else "") -%}
      {{ _raw if _raw == "" or ":" in _raw else "sha256:" ~ _raw }}

- name: Warn when no checksum is available for verification
  ansible.builtin.debug:
    msg: >-
      No checksum available for {{ garage_version }} ({{ _garage_arch }}).
      Binary will be downloaded without integrity verification.
      Set garage_checksum to provide a SHA256 checksum.
  when: _garage_effective_checksum | default('') | trim == ''

- name: Download Garage binary (remote)
  ansible.builtin.get_url:
    url: "{{ _garage_download_url }}"
    dest: "{{ garage_binary_path }}"
    checksum: "{{ _garage_effective_checksum | default(omit, true) }}"
    force: "{{ _garage_download_force | default(false) }}"
    mode: "0755"
    owner: root
    group: root
    timeout: 120
  when: not (garage_download_local | bool)
  notify: Restart garage
  retries: 3
  delay: 10

- name: Download and transfer Garage binary (local)
  when: garage_download_local | bool
  block:
    - name: Create temporary directory on controller
      ansible.builtin.tempfile:
        state: directory
        prefix: garage_
      delegate_to: localhost
      become: false
      register: _garage_local_tempdir

    - name: Download Garage binary to controller
      ansible.builtin.get_url:
        url: "{{ _garage_download_url }}"
        dest: "{{ _garage_local_tempdir.path }}/garage"
        checksum: "{{ _garage_effective_checksum | default(omit, true) }}"
        mode: "0755"
        timeout: 120
      delegate_to: localhost
      become: false
      retries: 3
      delay: 10

    - name: Copy Garage binary to remote host
      ansible.builtin.copy:
        src: "{{ _garage_local_tempdir.path }}/garage"
        dest: "{{ garage_binary_path }}"
        mode: "0755"
        owner: root
        group: root
      notify: Restart garage

  always:
    - name: Clean up temporary directory on controller
      ansible.builtin.file:
        path: "{{ _garage_local_tempdir.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: _garage_local_tempdir.path is defined

---
# Connects the cluster nodes to each other via 'garage node connect'.
# Garage persists known peers and gossips them between nodes, so this is
# effectively a one-time bootstrap; re-running is a harmless no-op.
# Requires all cluster hosts in the same play (peer node IDs are read from
# hostvars) — with 'serial' batches, hosts connect to previously-seen nodes
# only and the mesh converges through Garage's peer exchange.

- name: Resolve cluster hosts
  ansible.builtin.set_fact:
    _garage_cluster_hosts: >-
      {{ garage_cluster_hosts if garage_cluster_hosts | length > 0 else ansible_play_hosts }}

- name: Get node identifier
  ansible.builtin.command:
    cmd: "{{ garage_binary_path }} --config {{ garage_config_dir }}/garage.toml node id -q"
  register: _garage_node_id_output
  changed_when: false
  check_mode: false

- name: Set node identifier fact
  ansible.builtin.set_fact:
    _garage_node_full_id: "{{ _garage_node_id_output.stdout | trim }}"

- name: Connect to other cluster nodes
  ansible.builtin.command:
    cmd: >-
      {{ garage_binary_path }} --config {{ garage_config_dir }}/garage.toml
      node connect {{ hostvars[item]._garage_node_full_id }}
  loop: "{{ _garage_cluster_hosts | difference([inventory_hostname]) }}"
  when: hostvars[item]._garage_node_full_id is defined
  changed_when: false

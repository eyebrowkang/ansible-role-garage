---
garage_version: "v2.3.0"
garage_user: "garage"
garage_group: "garage"
garage_home: "/var/lib/garage"
garage_config_dir: "/etc/garage"

garage_data_dir: "{{ garage_home }}/data"
garage_data_dirs: []
garage_metadata_dir: "{{ garage_home }}/meta"

garage_db_engine: "lmdb"
garage_replication_factor: 1

# RPC
# Generate with: openssl rand -hex 32
garage_rpc_secret: ""
garage_rpc_secret_file: ""
garage_rpc_bind_addr: "[::]:3901"
garage_rpc_public_addr: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}:3901"
garage_bootstrap_peers: []

# S3 API
garage_s3_region: "garage"
garage_s3_api_bind_addr: "[::]:3900"
garage_s3_root_domain: ""

# S3 Web
garage_s3_web_bind_addr: ""
garage_s3_web_root_domain: ""

# Admin
garage_admin_api_bind_addr: "[::]:3903"
garage_admin_healthcheck_host: "127.0.0.1"
garage_healthcheck_enabled: false
garage_admin_token: ""
garage_admin_token_file: ""
garage_metrics_token: ""
garage_metrics_token_file: ""

# Cluster bootstrap (enhancement, disabled by default)
# Connects all play hosts (or garage_cluster_hosts) to each other via
# 'garage node connect' after the service is up.
garage_cluster_connect: false
garage_cluster_hosts: []

# Layout initialization (enhancement, disabled by default)
# Applies the FIRST cluster layout only (layout version 0 -> 1); any later
# layout change is an operator action and is never touched by this role.
# Zone/capacity/tags are per-node values (set via host_vars for
# heterogeneous nodes). Set garage_layout_gateway instead of a capacity
# for gateway nodes.
garage_layout_init: false
garage_layout_zone: ""
garage_layout_capacity: ""
garage_layout_gateway: false
garage_layout_tags: []

# Upgrade control
garage_upgrade: false
garage_upgrade_precheck: true
garage_checksum: ""

# Download options
garage_download_url: ""
garage_download_local: false

# Configuration
garage_config_template: "garage.toml.j2"
# Set false to see config diffs while debugging (config contains secrets)
garage_no_log: true
garage_env_variables:
  GARAGE_LOG_TO_JOURNALD: "1"
